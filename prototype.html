<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf — UI prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;650&display=swap">
<style>
:root{--win:#F5F5F7;--side:rgba(245,245,247,.8);--content:#fff;--raised:#fff;--ink:#1D1D1F;--ink2:rgba(29,29,31,.72);--ink3:rgba(29,29,31,.48);--line:rgba(29,29,31,.1);--acc:#0066CC;--cau:#B7791F;--dan:#C2410C;--bg:#d6d7dc;--ic:var(--ink2);--ic-on:var(--acc);--soft:color-mix(in srgb,var(--acc) 12%,transparent);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--win:#1D1D1F;--side:rgba(29,29,31,.8);--content:#161617;--raised:#2A2A2D;--ink:#F5F5F7;--ink2:rgba(245,245,247,.72);--ink3:rgba(245,245,247,.48);--line:rgba(245,245,247,.12);--acc:#2997FF;--cau:#E0A94A;--dan:#F08A5D;--bg:#0a0a0b;color-scheme:dark}}
:root[data-theme="dark"]{--win:#1D1D1F;--side:rgba(29,29,31,.8);--content:#161617;--raised:#2A2A2D;--ink:#F5F5F7;--ink2:rgba(245,245,247,.72);--ink3:rgba(245,245,247,.48);--line:rgba(245,245,247,.12);--acc:#2997FF;--cau:#E0A94A;--dan:#F08A5D;--bg:#0a0a0b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);font:450 13px/18px Inter,system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;text-align:left}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.g{fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.win{display:grid;grid-template-columns:216px 1fr auto;grid-template-rows:48px 1fr;height:100%;max-width:1440px;margin:0 auto;background:var(--win);overflow:hidden;position:relative}
@media (min-width:1200px){body{padding:24px}.win{height:calc(100vh - 48px);max-height:860px;border-radius:14px;border:.5px solid var(--line);box-shadow:0 8px 24px -4px rgba(0,0,0,.18)}}
aside{grid-row:1/3;background:var(--side);border-right:.5px solid var(--line);padding:14px 8px;overflow:auto;display:flex;flex-direction:column;gap:16px;z-index:5}
.brand{font-weight:650;font-size:15px;letter-spacing:-.01em;padding:4px 10px 0}
.grp{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;width:100%;color:var(--ink)}
.nav svg{color:var(--ic);width:18px;height:18px}.nav:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.nav.on{background:color-mix(in srgb,var(--acc) 14%,transparent)}.nav.on svg{color:var(--ic-on)}.nav.on svg:not(.g){fill:color-mix(in srgb,var(--acc) 25%,transparent)}
.nav .bd{margin-left:auto;font-size:11.5px;color:var(--ink3);font-weight:500}
header{grid-column:2/4;display:flex;align-items:center;gap:8px;padding:0 16px 0 12px;border-bottom:.5px solid var(--line);background:var(--win)}
.ib{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--ic);transition:background .3s ease-out,transform .3s ease-out}
.ib svg{width:18px;height:18px}.ib:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}.ib:active{transform:scale(.98)}.ib[aria-pressed=true]{color:var(--ic-on);background:var(--soft)}
.field{flex:1;max-width:640px;margin:0 auto;display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:10px;background:var(--content);border:.5px solid var(--line);overflow:hidden}
.field:focus-within{outline:2px solid var(--acc);outline-offset:0}
.field input{flex:1;min-width:60px;border:0;outline:0;background:none;font-size:15px;line-height:20px}
.field input::placeholder{color:var(--ink3)}
#chips{display:flex;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px 0 6px;border-radius:99px;background:var(--soft);color:var(--acc);font:500 11.5px/14px Inter,system-ui,sans-serif;white-space:nowrap;cursor:pointer}
.chip svg{width:12px;height:12px}
kbd{font:500 11px Inter,system-ui,sans-serif;color:var(--ink3)}
main{background:var(--content);overflow:auto;padding:24px;position:relative;grid-column:2}
.tools{grid-column:3;grid-row:2;width:0;overflow:hidden;background:var(--raised);border-left:.5px solid var(--line);transition:width .18s cubic-bezier(.2,0,0,1)}
.tools.open{width:300px}
.insp{width:300px;padding:16px;overflow:auto;height:100%;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;line-height:28px;font-weight:650;letter-spacing:-.02em}
h2{font-size:15px;line-height:20px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:12px;line-height:16px}
.bar{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.bar input[type=range]{margin-left:auto;width:120px;accent-color:var(--acc);align-self:center}
.rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;margin:12px 0 32px}
.rail .cell{width:160px;flex:none}
.shelf{margin-bottom:24px}.shelf h2{display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer;width:max-content}
.shelf .ico{width:16px;height:16px;display:grid;place-items:center;color:var(--h)}
.row{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 8px}.row .cell{width:96px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell,144px),1fr));gap:12px}
.gh{grid-column:1/-1;position:sticky;top:-24px;height:28px;line-height:28px;background:var(--content);font-weight:600;font-size:15px;z-index:2}
.cell{display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .3s ease-out,opacity .24s;min-width:0}
.cell .sq{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;transition:transform .3s ease-out}
.cell:hover .sq{transform:scale(1.02)}.cell:active .sq{transform:scale(.98)}
.cell .sq .th{max-width:100%;max-height:100%;width:100%;height:100%}
.cell.on .sq{outline:2px solid var(--acc);outline-offset:2px}
.nm{font-size:13px;text-align:center;padding:1px 6px;border-radius:99px;align-self:center;max-width:100%;white-space:nowrap}
.cell.on .nm{background:var(--acc);color:#fff}
.cell .d2{font-size:12px;color:var(--ink2);text-align:center;margin-top:-4px}
.cell.fly{transform:translate(-45vw,40vh) scale(.3);opacity:0;transition:transform .24s cubic-bezier(.2,0,0,1),opacity .24s}
.th{position:relative;border-radius:6px;overflow:hidden;background:var(--raised);display:grid;place-items:center;color:var(--ink3);box-shadow:inset 0 0 0 .5px var(--line);container-type:size}
.th svg{width:30%;height:30%}
.th.Images{background:hsl(var(--h) 38% 72%)}
.th i{position:absolute;right:22%;top:18%;width:18%;aspect-ratio:1;border-radius:50%;background:hsl(var(--h) 60% 94%)}
.th u{position:absolute;left:0;right:0;bottom:0;height:46%;background:hsl(var(--h) 34% 42%);clip-path:polygon(0 100%,25% 25%,50% 70%,75% 8%,100% 100%)}
.th.ss{background:var(--content)}.th.ss b:first-child{position:absolute;inset:0 0 auto;height:14%;background:var(--line)}
.th.ss b:last-child{position:absolute;left:12%;top:30%;width:60%;height:42%;border-radius:3px;background:hsl(var(--h) 40% 70%)}
.th.Documents,.th.bt{background:color-mix(in srgb,var(--ink) 8%,var(--raised))}
.pg{position:relative;display:block;height:84cqmin;aspect-ratio:3/4;background:#fff;border-radius:2cqmin;padding-top:16cqmin;clip-path:polygon(0 0,calc(100% - 13cqmin) 0,100% 13cqmin,100% 100%,0 100%)}
.pg .fd{position:absolute;top:0;right:0;width:13cqmin;aspect-ratio:1;background:#c5cad4;clip-path:polygon(0 0,100% 100%,0 100%)}
.pg .bd2{display:flex;flex-direction:column;gap:3cqmin;padding:0 9cqmin}
.pg .hd{height:4.6cqmin;background:#3a4150;border-radius:1cqmin}
.pg .l{display:block;height:2.6cqmin;background:#d4d8df;border-radius:1cqmin}
.pg .im{height:15cqmin;background:#e3e7ee;border-radius:1.4cqmin}.pg .gap{height:2cqmin}
.pg .bl{display:flex;align-items:center;gap:2cqmin}.pg .bl .l{flex:none}
.pg .dt{width:2.6cqmin;aspect-ratio:1;border-radius:50%;flex:none}
.pg .gr{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:1.2cqmin}.pg .gr span{height:4.4cqmin;background:#e2e8e4}.pg .gr .hr{opacity:.9}
.pg .tg,.tg2{font:650 max(6px,6.4cqmin)/1 Inter,system-ui,sans-serif;letter-spacing:.04em;padding:1.7cqmin 3.2cqmin;border-radius:99px;background:var(--c);color:#fff}
.pg .tg{position:absolute;left:9cqmin;bottom:8cqmin}
.th.bt{display:flex;flex-direction:column;align-items:center;justify-content:center}.th.bt .tg2{margin-top:7cqmin}
.th.bt .sq2{width:46cqmin;height:46cqmin;flex:none;border-radius:22%;background:var(--c);color:#fff;display:grid;place-items:center}
.th.bt .sq2 svg{width:56%;height:56%}
.th.Videos{background:#26262a;color:#e8e8ec}
.th .pb{width:32cqmin;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.th .pb svg{width:42%;height:42%;margin-left:6%}
.th.Music{background:hsl(var(--h) 38% 36%);color:#fff;position:relative}
.th.Music svg{width:40%;height:40%}
.th.Music .tg2{position:absolute;bottom:9cqmin;background:rgba(255,255,255,.2)}
.dur{position:absolute;right:4px;bottom:4px;display:flex;align-items:center;gap:3px;font:500 10px Inter,sans-serif;color:#fff;background:rgba(0,0,0,.5);padding:1px 5px;border-radius:99px}
table{width:100%;border-collapse:collapse}th{font-weight:500;color:var(--ink3);text-align:left;font-size:12px;padding:0 8px 8px;position:sticky;top:-24px;background:var(--content)}
td{height:32px;padding:0 8px;border-top:.5px solid var(--line);color:var(--ink2);white-space:nowrap;font-size:12px}
td:first-child{color:var(--ink);font-size:13px;max-width:280px;overflow:hidden;text-overflow:ellipsis}
tr.r{cursor:pointer}tr.r:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}tr.r.on{background:var(--soft)}
.num{text-align:right}
.cards{display:flex;flex-direction:column;gap:12px;max-width:640px}
.card{background:var(--raised);border:.5px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card .top{display:flex;justify-content:space-between;gap:12px}
.ev{display:flex;gap:6px;align-items:center;margin:4px 0}.ev .sqs{width:40px;height:40px;border-radius:6px;background:var(--win);display:grid;place-items:center;color:var(--ink3)}
.foot{display:flex;align-items:center;gap:8px;justify-content:space-between;color:var(--ink2);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.btn{height:32px;padding:0 14px;border-radius:8px;background:color-mix(in srgb,var(--ink) 7%,transparent);font-weight:500;transition:background .3s ease-out,transform .3s ease-out;text-align:center}
.btn:hover{background:color-mix(in srgb,var(--ink) 12%,transparent)}.btn:active{transform:scale(.98)}
.btn.i{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.th .dur svg{width:10px;height:10px}
.btn.p{background:var(--acc);color:#fff}.btn.p:hover{filter:brightness(1.1)}.btn[disabled]{opacity:.4;pointer-events:none}
code{display:block;font:12px/18px ui-monospace,monospace;background:var(--win);padding:8px 10px;border-radius:8px;overflow-x:auto;white-space:pre}
.rv{display:flex;align-items:center;gap:12px;height:40px;border-top:.5px solid var(--line);cursor:pointer}.rv input{accent-color:var(--acc);width:16px;height:16px}
.rv span:last-child{margin-left:auto;color:var(--ink2)}
.sticky{position:sticky;bottom:-24px;margin:16px -24px -24px;padding:12px 24px;background:var(--raised);border-top:.5px solid var(--line);display:flex;justify-content:flex-end}
dl{display:grid;grid-template-columns:84px 1fr;gap:6px 8px;font-size:12px;line-height:16px}dt{color:var(--ink3)}dd{color:var(--ink)}
.pv{aspect-ratio:4/3;border-radius:6px;overflow:hidden}.pv .th{width:100%;height:100%}
.acts{display:flex;flex-direction:column;gap:8px}
.empty{color:var(--ink2);max-width:44ch;display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding-top:8px}
.empty .chip{margin-right:4px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--raised);border:.5px solid var(--line);border-radius:12px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px -4px rgba(0,0,0,.18);transition:all .18s cubic-bezier(.2,0,0,1);z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.hide{display:none}
@media (max-width:959px){.tools{position:absolute;right:0;top:48px;bottom:0;z-index:6}.win{grid-template-columns:216px 1fr}header{grid-column:2}}
@media (max-width:839px){.win{grid-template-columns:1fr}aside{position:absolute;top:0;bottom:0;left:0;width:216px;transform:translateX(-100%);transition:transform .18s cubic-bezier(.2,0,0,1);background:var(--win)}aside.open{transform:none;box-shadow:0 8px 24px -4px rgba(0,0,0,.3)}header,main{grid-column:1}.tools.open{width:min(300px,86vw)}main{padding:16px}.field kbd{display:none}.hv{display:none}}
@media (prefers-reduced-motion:reduce){*{transition-duration:90ms!important}.cell:hover .sq{transform:none}}
</style>
</head>

function cleanHTML(){
 if(S.rv){const c=CU.find(x=>x.id==S.rv),ch=S.chk[c.id]||(S.chk[c.id]=c.it.map(()=>c.risk=='Low'));const n=ch.filter(Boolean).length,m=c.it.reduce((a,b,i)=>a+(ch[i]?b[1]:0),0);
  return `<button class="btn" data-a="cuback" style="display:inline-flex;gap:4px;align-items:center;padding-left:8px">${ic('back')}Clean Up</button><div class="bar" style="margin-top:16px"><h1>${c.t}</h1><span class="sub">${c.loc}</span></div><div class="cards">${c.it.map((x,i)=>`<label class="rv"><input type="checkbox" data-a="chk" data-i="${i}"${ch[i]?' checked':''}><span>${x[0]}</span><span>${usd(x[1])}</span></label>`).join('')}<p class="sub">${c.risk} risk. ${c.risk=='Low'?'All files are selected.':'Nothing is selected. Choose what to move.'} Everything goes to the Trash and can be restored.</p></div><div class="sticky"><button class="btn p" data-a="cuGo"${n?'':' disabled'}>Move ${n} file${n==1?'':'s'} to Trash · ${usd(m)}</button></div>`}
 const L=CU.filter(c=>!S.cleaned.has(c.id)).sort((a,b)=>cuSize(b)-cuSize(a));
 if(!L.length)return `<h1>Clean Up</h1><div class="empty"><p>Nothing to clean up. Shelf checks again after each scan.</p></div>`;
 return `<div class="bar"><h1>Clean Up</h1><span class="sub">${usd(L.reduce((a,c)=>a+cuSize(c),0))} can be reclaimed. Last scan 4 minutes ago.</span></div><div class="cards">${L.map(c=>`<div class="card"><div class="top"><h2>${c.t}</h2><h2>${usd(cuSize(c))}</h2></div><p class="sub">${c.why}</p>${c.sys?`<code>${c.sys.replace(/"/g,'&quot;')}</code><p class="sub">Counts only space you get back.</p>`:`<div class="ev">${c.it.slice(0,4).map(x=>`<div class="sqs">${ic(/\.png$/.test(x[0])?'img':/\.(deb|rpm|AppImage)$/.test(x[0])?'app':'arc')}</div>`).join('')}${c.it.length>4?`<span class="sub">+${c.it.length-4}</span>`:''}</div>`}<div class="foot"><span><span class="dot" style="background:${RC[c.risk]}"></span>${c.risk} risk · ${c.sys?'Report only':'Moves to Trash'}</span>${c.sys?`<button class="btn" data-a="copycmd" data-t="${c.sys.replace(/"/g,'&quot;')}">Copy command</button>`:`<button class="btn" data-a="review" data-id="${c.id}">Review</button>`}</div></div>`).join('')}</div>`}
function homeHTML(){const A=F.filter(vis).sort((a,b)=>a.days-b.days);
 return `<h1>Just added</h1><div class="rail">${A.slice(0,12).map(f=>cell(f,22)).join('')}</div>`+Object.keys(K).map(k=>{const L=A.filter(f=>f.kind==k);return L.length?`<div class="shelf"><h2 data-a="nav" data-v="${k}"><span class="ico" style="--h:hsl(${[210,280,330,28,150,190][Object.keys(K).indexOf(k)]} 70% 45%)">${ic(K[k])}</span>${k} <span class="sub">${L.length}</span></h2><div class="row">${L.slice(0,8).map(f=>cell(f,13)).join('')}</div></div>`:''}).join('')}
function mainHTML(){
 if(S.v=='cleanup'&&!active())return cleanHTML();
 if(S.v=='home'&&!active())return homeHTML();
 const srch=active(),L=(srch?results():base(S.v).sort((a,b)=>a.days-b.days)),title=srch?'Results':(TT[S.v]||S.v);
 const body=!L.length?(srch?emptyHTML():`<div class="empty"><p>${S.v=='trash'?'Trash is empty. Files you move here can be restored.':S.v=='downloads'?'Nothing here yet. New downloads appear as they finish.':'Nothing here yet.'}</p></div>`):S.mode=='grid'?gridHTML(L):listHTML(L);
 return `<div class="bar"><h1>${title}</h1><span class="sub">${L.length} file${L.length==1?'':'s'} · ${sz(L.reduce((a,f)=>a+f.mb,0))}</span>${S.mode=='grid'?`<input type="range" min="96" max="320" step="8" value="${S.cell}" data-a="zoom" aria-label="Thumbnail size">`:''}</div>${body}`}
function inspHTML(){const L=[...S.sel].map(i=>F[i]).filter(vis);
 if(!L.length)return `<h2>Nothing selected</h2><p class="sub">Select a file to see its preview and details.</p>`;
 if(L.length>1)return `<div class="pv" style="display:grid;place-items:center;background:var(--win)"><h1>${L.length}</h1></div><h2>${L.length} files selected</h2><dl><dt>Combined size</dt><dd>${sz(L.reduce((a,f)=>a+f.mb,0))}</dd></dl><div class="acts"><button class="btn i" data-a="trash">${ic('trash')}Move to Trash</button></div>`;
 const f=L[0];return `<div class="pv">${th(f)}</div><div><h2 style="word-break:break-all">${f.name}</h2><p class="sub">${KS[f.kind]}</p></div><dl><dt>Size</dt><dd>${sz(f.mb)}</dd>${f.kind=='Images'?`<dt>Dimensions</dt><dd>${f.ss?'2880 × 1800':'4032 × 3024'}</dd>`:''}<dt>Modified</dt><dd>${when(f)}</dd><dt>Location</dt><dd>~/${f.loc}</dd>${f.from?`<dt>From</dt><dd title="https://${f.from}">${f.from}</dd>`:''}</dl>${f.ss?'<div><h2 style="margin-bottom:4px">Found text</h2><p class="sub">Order confirmed. Arrives <mark style="background:color-mix(in srgb,var(--acc) 20%,transparent);color:inherit">Thursday</mark> between 9 and 12.</p></div>':''}<div class="acts"><button class="btn p i" data-a="show">${ic('folder')}Show in Files</button><button class="btn i" data-a="copy" data-t="~/${f.loc}/${f.name}">${ic('copy')}Copy path</button><button class="btn i" data-a="trash">${ic('trash')}Move to Trash</button></div>`}
function render(){
 themeIcon();
 $('#side').innerHTML=`<div class="brand">Shelf</div>`+NAV.map(g=>`<div class="grp">${g.map(([id,l,i])=>{const n=id=='trash'?S.T.length+S.xt:0,cu=id=='cleanup'&&CU.some(c=>!S.cleaned.has(c.id));return `<button class="nav${S.v==id&&!active()?' on':''}" data-a="nav" data-v="${id}">${ic(i)}<span>${l}</span>${n?`<span class="bd">${n}</span>`:''}${cu?`<span class="bd">${usd(CU.filter(c=>!S.cleaned.has(c.id)).reduce((a,c)=>a+cuSize(c),0))}</span>`:''}</button>`}).join('')}</div>`).join('');
 $('#main').innerHTML=mainHTML();$('#insp').innerHTML=inspHTML();
 $('#tools').classList.toggle('open',S.insp);$('#side').classList.toggle('open',S.side);$('#win').style.gridTemplateColumns=innerWidth>=840?(S.side?'216px 1fr auto':'0px 1fr auto'):'';
 $('#bGrid').setAttribute('aria-pressed',S.mode=='grid');$('#bList').setAttribute('aria-pressed',S.mode=='list');$('#bInfo').setAttribute('aria-pressed',S.insp);
 $('#chips').innerHTML=S.chips.map((c,i)=>`<span class="chip" title="${c.t}" data-a="chipx" data-i="${i}">${ic(c.g)}${c.l}</span>`).join('')}
function trash(ids){ids=ids||[...S.sel];if(!ids.length)return;ids.forEach(i=>document.querySelectorAll(`.cell[data-id="${i}"]`).forEach(e=>e.classList.add('fly')));setTimeout(()=>{S.T.push(...ids);S.sel.clear();render();toast(`Moved ${ids.length==1?F[ids[0]].name:ids.length+' files'} to Trash.`,()=>{S.T=S.T.filter(i=>!ids.includes(i));render()})},240)}
function copy(btn,t){try{navigator.clipboard.writeText(t)}catch(e){}const o=btn.innerHTML;btn.innerHTML=ic('check')+'Copied';setTimeout(()=>btn.innerHTML=o,1500)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,d=el.dataset;
 if(a=='pick'){const id=+d.id;if(e.ctrlKey||e.metaKey){S.sel.has(id)?S.sel.delete(id):S.sel.add(id)}else S.sel=new Set([id]);S.insp=true;render();return}
 if(a=='nav'){S.v=d.v;S.rv=null;S.sel.clear();S.chips=[];qi.value='';if(innerWidth<840)S.side=false;$('#main').scrollTop=0;render()}
 else if(a=='side'){S.side=!S.side;render()}else if(a=='info'){S.insp=!S.insp;render()}
 else if(a=='grid'||a=='list'){S.mode=a;render()}
 else if(a=='theme'){document.documentElement.dataset.theme=isDark()?'light':'dark';themeIcon()}
 else if(a=='chipx'){S.chips.splice(+d.i,1);render()}
 else if(a=='drop'){S.chips=S.chips.filter(c=>c.l!=d.l);render()}
 else if(a=='trash')trash();
 else if(a=='undo'){S.undo&&S.undo();$('#toast').classList.remove('show')}
 else if(a=='copy'||a=='copycmd')copy(el,d.t);
 else if(a=='show')toast('Opened the folder in Files.');
 else if(a=='review'){S.rv=d.id;render()}else if(a=='cuback'){S.rv=null;render()}
 else if(a=='chk'){S.chk[S.rv][+d.i]=el.checked;render()}
 else if(a=='cuGo'){const c=CU.find(x=>x.id==S.rv),ch=S.chk[c.id],n=ch.filter(Boolean).length;if(!n)return;S.cleaned.add(c.id);S.xt+=n;S.rv=null;render();toast(`Moved ${n} files to Trash.`,()=>{S.cleaned.delete(c.id);S.xt-=n;render()})}
});
document.addEventListener('input',e=>{if(e.target.dataset.a=='zoom'){S.cell=+e.target.value;$('.grid').style.setProperty('--cell',S.cell+'px')}});
document.addEventListener('change',e=>{if(e.target.dataset.a=='zoom')render()});
qi.addEventListener('input',()=>{const v=qi.value,i=v.lastIndexOf(' ');if(i>=0){const r=extract(v.slice(0,i+1));if(r.c.length){S.chips.push(...r.c);qi.value=r.rest+(r.rest?' ':'')+v.slice(i+1)}}render()});
qi.addEventListener('keydown',e=>{if(e.key=='Enter'){const r=extract(qi.value);if(r.c.length){S.chips.push(...r.c);qi.value=r.rest;render()}}if(e.key=='Backspace'&&!qi.value&&S.chips.length){S.chips.pop();render()}if(e.key=='Escape')qi.blur()});
document.addEventListener('keydown',e=>{const t=e.target.tagName=='INPUT',c=e.ctrlKey||e.metaKey;
 if((c&&(e.key=='f'||e.key=='k'))||(e.key=='/'&&!t)){e.preventDefault();qi.focus();return}if(t)return;
 if(e.key==' '||(c&&e.key=='i')){e.preventDefault();S.insp=!S.insp;render()}else if(c&&e.key=='b'){e.preventDefault();S.side=!S.side;render()}
 else if(c&&e.key=='1'){e.preventDefault();S.mode='grid';render()}else if(c&&e.key=='2'){e.preventDefault();S.mode='list';render()}
 else if(e.key=='Delete')trash();else if(e.key=='Enter'&&e.target.dataset.a=='pick')e.target.click()});
render();
</script>
</body>
</html>
